services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: givvi
      POSTGRES_DB: givvi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U givvi -d givvi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  postgres_data:
